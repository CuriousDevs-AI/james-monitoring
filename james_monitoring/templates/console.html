<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console · james-monitoring</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16181d;--muted:#5d6573;--line:#e3e6eb;--accent:#2f5bea;--accent-ink:#fff;
--ok:#1a7f4b;--ok-bg:#e5f5ec;--warn:#9a5b00;--warn-bg:#fdf2dc;--bad:#b42318;--bad-bg:#fde8e6;--chip:#eef0f4;--sel:#eef3ff;
--me:#2f5bea;--me-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--ink:#e8eaef;--muted:#9aa3b2;--line:#272b35;
--accent:#6c8cff;--accent-ink:#0f1115;--ok:#5fd39a;--ok-bg:#12301f;--warn:#f0b95a;--warn-bg:#33270f;--bad:#ff8a80;
--bad-bg:#3a1614;--chip:#222733;--sel:#1a2140;--me:#3a5bd9;--me-ink:#fff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;margin-right:8px}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav a{padding:6px 10px;border-radius:8px;color:var(--muted);text-decoration:none;cursor:pointer;position:relative}
nav a.on{background:var(--sel);color:var(--ink);font-weight:600}
.badge{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;margin-left:4px}
.spacer{flex:1}
main{max-width:1240px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:20px;margin:0 0 4px} h2{font-size:15px;margin:22px 0 10px} h3{margin:0;font-size:15px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi .n{font-size:26px;font-weight:700} .kpi .l{color:var(--muted);font-size:13px}
.cols{display:grid;gap:14px;grid-template-columns:1.2fr 1fr} @media(max-width:900px){.cols{grid-template-columns:1fr}}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 9px;font-size:12.5px;color:var(--muted);margin:1px 2px 1px 0}
.ok{background:var(--ok-bg);color:var(--ok)} .warn{background:var(--warn-bg);color:var(--warn)} .bad{background:var(--bad-bg);color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.list{display:grid;gap:8px} .item{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
button{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.danger{color:var(--bad)} button.sm{padding:3px 9px;font-size:13px} button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:90px;resize:vertical} label{font-size:12px;color:var(--muted);display:block;margin:8px 0 3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px} .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:620px){.two,.three{grid-template-columns:1fr}}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--muted)}
.dot.on-track{background:var(--ok)}.dot.at-risk{background:var(--warn)}.dot.blocked{background:var(--bad)}
/* chat */
.chat{display:grid;grid-template-columns:240px 1fr;gap:12px;height:calc(100vh - 140px);min-height:420px}
@media(max-width:760px){.chat{grid-template-columns:1fr;height:auto}}
.rooms{overflow:auto} .room{padding:9px 10px;border-radius:9px;cursor:pointer;display:flex;gap:8px;align-items:center}
.room.on{background:var(--sel)} .room .r{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv{display:flex;flex-direction:column;min-height:420px}
.msgs{flex:1;overflow:auto;padding:6px 4px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:8px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);white-space:pre-wrap;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--me);color:var(--me-ink);border-color:var(--me)}
.msg.system{align-self:center;background:var(--chip);border:none;font-size:13px;max-width:92%}
.msg.notice{border-color:var(--warn)} .msg.ask{border:2px solid var(--bad)}
.msg .who{font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:2px} .msg.me .who{color:#dfe6ff}
.compose{display:flex;gap:8px;margin-top:8px} .compose textarea{min-height:44px;height:44px}
/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:10px;overflow-x:auto}
.col{background:var(--chip);border-radius:12px;padding:8px;min-height:120px}
.col h4{margin:4px 6px 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.task{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px;cursor:pointer}
.task:hover{border-color:var(--accent)} .task .t{font-weight:600;font-size:14px}
.p0{color:var(--bad);font-weight:700} .p1{color:var(--warn);font-weight:700} .p2{color:var(--muted);font-weight:700}
/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--card);border-left:1px solid var(--line);
box-shadow:-10px 0 30px rgba(0,0,0,.12);padding:18px;overflow:auto;z-index:20;display:none}
.drawer.open{display:block} .md h1,.md h2,.md h3{margin:14px 0 6px} .md p{margin:6px 0} .md ul{margin:4px 0 4px 18px;padding:0}
.md code{background:var(--chip);padding:1px 5px;border-radius:5px} pre{white-space:pre-wrap;background:var(--chip);padding:10px;border-radius:8px;font-size:13px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:20px;text-align:center;background:var(--card)} .drop.over{border-color:var(--accent);background:var(--sel)}
.steps{list-style:none;padding:0;margin:6px 0;display:grid;gap:4px;font-size:13.5px} .steps li{display:flex;gap:6px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;z-index:30;display:none}
.center{max-width:640px;margin:30px auto}
.err{color:var(--bad);font-size:13px}
</style>
</head>
<body>
<header id="hdr" style="display:none"><div class="bar">
  <span class="brand" id="brand">Company</span>
  <nav id="nav"></nav><span class="spacer"></span>
  <span id="tgchip"></span>
  <button class="sm" id="pauseAll"></button>
</div></header>
<main id="main"></main>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>

<script>
const KEY = new URLSearchParams(location.search).get("k") || "";
let S = null, VIEW = "dashboard", ROOM = "team", LAST = {}, timers = [];
const $ = (s, r = document) => r.querySelector(s);
async function api(path, body) {
  const opt = body === undefined ? {headers: {"X-JM-Key": KEY}}
    : {method: "POST", headers: {"X-JM-Key": KEY, "Content-Type": "application/json"}, body: JSON.stringify(body)};
  const r = await fetch(path, opt); const j = await r.json().catch(() => ({error: "bad response"}));
  if (!r.ok) throw new Error(j.error || r.statusText); return j;
}
function h(tag, attrs = {}, ...kids) {

  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v; else if (k === "html") e.innerHTML = v; else e.setAttribute(k, v === true ? "" : v);
  }

}
Element.prototype.put = function (...kids) { this.replaceChildren(...kids.flat(9).filter(k => k != null && k !== false)); return this; };
const chip = (t, c = "") => h("span", {class: "chip " + c}, t);
const toast = (t) => { const e = $("#toast"); e.textContent = t; e.style.display = "block"; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = "none", 2600); };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
function md(src) {
  const lines = String(src || "").split("\n"); let out = "", list = false;
  const inl = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  for (const l of lines) {
    const m = l.match(/^(#{1,3})\s+(.*)/), li = l.match(/^\s*[-*]\s+(.*)/);
    if (li) { if (!list) { out += "<ul>"; list = true; } out += "<li>" + inl(li[1].replace(/^\[ \]\s*/, "☐ ").replace(/^\[x\]\s*/i, "☑ ")) + "</li>"; continue; }
    if (list) { out += "</ul>"; list = false; }
    if (m) out += `<h${m[1].length + 1}>${inl(m[2])}</h${m[1].length + 1}>`; else if (l.trim()) out += "<p>" + inl(l) + "</p>";
  }
  return out + (list ? "</ul>" : "");
}
const nameOf = id => (S?.members || []).find(m => m.id === id)?.name || (id === S?.owner_key ? S.owner : id);
const clearTimers = () => { timers.forEach(clearInterval); timers = []; };
function openDrawer(...kids) { const d = $("#drawer"); d.put(h("div", {class: "row"}, h("span", {class: "spacer"}), h("button", {class: "sm", onclick: closeDrawer}, "Close")), ...kids); d.classList.add("open"); }
function closeDrawer() { $("#drawer").classList.remove("open"); }

// ---------------------------------------------------------------- boot
async function boot() {
  if (!KEY) { $("#main").innerHTML = "<div class='center card'>Open the console with the link <code>jm run</code> printed (it includes a key).</div>"; return; }
  S = await api("/api/state");
  if (S.setup_needed) return renderSetup();
  $("#hdr").style.display = "block"; $("#brand").textContent = S.company;
  const views = [["dashboard", "Dashboard"], ["chat", "Chat"], ["board", "Board"], ["projects", "Projects"], ["team", "Team"],
                 ["approvals", "Approvals"], ["reports", "Reports"], ["settings", "Settings"]];
  $("#nav").put(...views.map(([v, t]) => h("a", {class: VIEW === v ? "on" : "", onclick: () => go(v), "data-v": v}, t)));
  $("#tgchip").put(S.telegram.connected ? chip("Telegram on", "ok") : chip("Telegram off", ""),
    S.llm_error ? chip("Model problem: see Settings", "bad") : null);
  const pb = $("#pauseAll"); pb.textContent = S.paused_all ? "▶ Resume team" : "⏸ Pause team";
  pb.onclick = async () => { await api("/api/pause", {who: "all", pause: !S.paused_all}); toast(S.paused_all ? "Team resumed" : "Team paused"); refresh(); };
  api("/api/asks").then(a => { const n = a.filter(x => x.status === "pending").length; const link = $('#nav a[data-v="approvals"]'); if (link && n) link.append(h("span", {class: "badge"}, n)); });
  render();
}
async function refresh() { S = await api("/api/state"); boot(); }
function go(v) { VIEW = v; closeDrawer(); boot(); }
function render() {
  clearTimers();
  const fn = {dashboard: vDashboard, chat: vChat, board: vBoard, projects: vProjects, team: vTeam, approvals: vApprovals, reports: vReports, settings: vSettings}[VIEW];
  $("#main").put(h("div", {class: "muted"}, "Loading…"));
  fn().catch(e => $("#main").put(h("div", {class: "card err"}, e.message)));
}

// ---------------------------------------------------------------- setup
function renderSetup() {
  const f = {company: h("input", {placeholder: "e.g. Acme Robotics"}), owner: h("input", {placeholder: "Your name"}),
    timezone: h("input", {value: S.timezone}), goals: h("textarea", {placeholder: "One goal per line (optional)"}),
    provider: h("select", {}, h("option", {value: "claude-code"}, "Claude subscription (claude CLI, no API key)"),
      h("option", {value: "anthropic"}, "Anthropic API key"), h("option", {value: "openai"}, "OpenAI-compatible (OpenAI, Codex, Ollama, OpenRouter)")),
    model: h("input", {placeholder: "blank = default (claude-code), e.g. sonnet"}), base_url: h("input", {placeholder: "only for Ollama/OpenRouter"}),
    api_key: h("input", {type: "password", placeholder: "only for API providers"}),
    workspace: h("input", {value: "./team-workspace"}), clone_url: h("input", {placeholder: "optional: https://github.com/you/team.git"}),
    push: h("input", {type: "checkbox", style: "width:auto"}),
    manager_name: h("input", {value: "James"}), manager_role: h("input", {value: "Delivery manager and chief of staff"})};
  const err = h("div", {class: "err"}), btn = h("button", {class: "primary"}, "Create the team");
  btn.onclick = async () => {
    err.textContent = ""; btn.disabled = true; btn.textContent = "Setting up…";
    const b = {}; for (const [k, el] of Object.entries(f)) b[k] = el.type === "checkbox" ? el.checked : el.value;
    try { await api("/api/setup", b); VIEW = "team"; await refresh(); toast("Team created. Now add people."); }
    catch (e) { err.textContent = e.message; btn.disabled = false; btn.textContent = "Create the team"; }
  };
  $("#main").put(h("div", {class: "center"},
    h("h1", {}, "Set up your company"), h("p", {class: "muted"}, `Folder: ${S.folder}. Everything here can be changed later in Settings.`),
    h("div", {class: "card"}, h("h3", {}, "1 · Company"), h("div", {class: "two"}, h("div", {}, h("label", {}, "Company / project"), f.company), h("div", {}, h("label", {}, "Your name (founder)"), f.owner)),
      h("label", {}, "Timezone"), f.timezone, h("label", {}, "Goals"), f.goals), h("div", {style: "height:12px"}),
    h("div", {class: "card"}, h("h3", {}, "2 · AI model"), h("label", {}, "Provider"), f.provider, h("div", {class: "two"}, h("div", {}, h("label", {}, "Model"), f.model), h("div", {}, h("label", {}, "API base URL"), f.base_url)),
      h("label", {}, "API key"), f.api_key), h("div", {style: "height:12px"}),
    h("div", {class: "card"}, h("h3", {}, "3 · Team repo (tasks, personas, memory, reports)"), h("label", {}, "Folder"), f.workspace, h("label", {}, "Clone from git URL"), f.clone_url,
      h("label", {}, h("span", {class: "row"}, f.push, " Push to the remote after every change"))), h("div", {style: "height:12px"}),
    h("div", {class: "card"}, h("h3", {}, "4 · Manager"), h("p", {class: "muted small"}, "Watches everyone, routes messages, reports to you."),
      h("div", {class: "two"}, h("div", {}, h("label", {}, "Name"), f.manager_name), h("div", {}, h("label", {}, "Role"), f.manager_role))),
    h("div", {style: "height:14px"}), h("div", {class: "row"}, btn, err)));
}

// ---------------------------------------------------------------- dashboard
async function vDashboard() {
  const d = await api("/api/dashboard");
  const kpi = (n, l, c = "") => h("div", {class: "card kpi"}, h("div", {class: "n " + c}, n), h("div", {class: "l"}, l));
  const taskLine = t => h("div", {class: "item", style: "cursor:pointer", onclick: () => taskDrawer(t.id)},
    h("div", {class: "row"}, h("b", {}, t.id), h("span", {class: "p" + t.priority[1]}, t.priority), t.title),
    h("div", {class: "small muted"}, `${nameOf(t.owner)} · ${t.status}${t.due ? " · due " + t.due : ""}${t.blocked_on ? " · blocked on " + t.blocked_on : ""}`, t.overdue ? chip("overdue", "bad") : null));
  const needs = [
    ...d.asks.map(a => askItem(a, () => render())),
    ...d.review.map(t => h("div", {class: "item"}, h("div", {class: "row"}, chip("review", "warn"), h("b", {}, t.id), t.title, h("span", {class: "spacer"}),
        h("button", {class: "sm", onclick: () => taskDrawer(t.id)}, "Open"),
        h("button", {class: "sm primary", onclick: async () => { await api("/api/task", {id: t.id, action: "accept"}); toast(t.id + " accepted"); render(); }}, "Accept")))),
    ...d.decisions.map(x => h("div", {class: "item row"}, chip("decide", ""), x, h("span", {class: "spacer"}), h("button", {class: "sm", onclick: () => go("reports")}, "Edit list")))];
  $("#main").put(
    h("div", {class: "row"}, h("h1", {}, "Dashboard"), h("span", {class: "spacer"}),
      h("button", {onclick: async e => { e.target.disabled = true; e.target.textContent = "Working…"; const r = await api("/api/work", {}).catch(x => ({digest: x.message})); toast("Work session done"); openDrawer(h("h3", {}, "Work session"), h("pre", {}, r.digest || "Nobody had open todo/doing tasks.")); render(); }}, "▶ Work session now"),
      h("button", {onclick: async () => { await api("/api/report/run", {}); toast("Report written and posted"); go("reports"); }}, "Write report now")),
    d.push_error ? h("div", {class: "card bad", style: "margin:10px 0"}, "Team repo can't push: " + d.push_error) : null,
    h("div", {class: "kpis", style: "margin-top:12px"}, kpi(d.tasks.open, "open tasks"), kpi(d.tasks.review, "waiting for your review", d.tasks.review ? "p1" : ""),
      kpi(d.tasks.blocked, "blocked", d.tasks.blocked ? "p0" : ""), kpi(d.tasks.overdue, "overdue", d.tasks.overdue ? "p0" : ""), kpi(d.tasks.done, "done")),
    h("div", {class: "cols", style: "margin-top:6px"},
      h("div", {}, h("h2", {}, `Needs you (${needs.length})`), needs.length ? h("div", {class: "list"}, needs) : h("div", {class: "card muted"}, "Nothing is waiting on you."),
        h("h2", {}, "Blocked or overdue"), d.attention.length ? h("div", {class: "list"}, d.attention.map(taskLine)) : h("div", {class: "card muted"}, "None."),
        h("h2", {}, "Critical path (P0)"), d.critical.length ? h("div", {class: "list"}, d.critical.map(taskLine)) : h("div", {class: "card muted"}, "No P0 set. Give each active project one.")),
      h("div", {}, h("h2", {}, "People"), h("div", {class: "list"}, d.people.map(p => h("div", {class: "item", style: "cursor:pointer", onclick: () => memberDrawer(p.id)},
          h("div", {class: "row"}, h("span", {class: "dot " + p.status.replace(" ", "-")}), h("b", {}, p.name), h("span", {class: "small muted"}, p.status), h("span", {class: "spacer"}),
            p.tokens ? h("span", {class: "small muted"}, `${Math.round(p.tokens / 1000)}k / ${Math.round(d.budget / 1000)}k tokens`) : null),
          h("div", {class: "small muted"}, p.line), p.error ? h("div", {class: "err"}, "⚠️ " + p.error) : null))),
        h("h2", {}, "Recent activity (team repo)"), h("div", {class: "card small"}, d.commits.length ? d.commits.map(c => h("div", {}, c)) : "No commits yet."))));
}
function askItem(a, after) {
  const note = h("input", {placeholder: "note (optional)"});
  const decide = async (dec) => { try { const r = await api("/api/ask", {id: a.id, decision: dec, note: note.value}); toast(r.result); after && after(); } catch (e) { toast(e.message); } };
  return h("div", {class: "item"}, h("div", {class: "row"}, chip(a.level === "red" ? "🔴 needs you" : "🟡 FYI", a.level === "red" ? "bad" : "warn"), h("b", {}, a.id), h("span", {class: "muted"}, "from " + nameOf(a.from))),
    h("div", {style: "margin:4px 0"}, a.summary), a.details ? h("pre", {}, a.details) : null,
    a.recommendation ? h("div", {class: "small muted"}, `${nameOf(S.manager)} recommends: ${a.recommendation}`) : null,
    a.status === "pending" ? h("div", {class: "row", style: "margin-top:6px"}, note, h("button", {class: "primary sm", onclick: () => decide("approved")}, "Approve"), h("button", {class: "danger sm", onclick: () => decide("rejected")}, "Reject"))
      : h("div", {class: "small"}, chip(a.status, a.status === "approved" ? "ok" : "bad")));
}

// ---------------------------------------------------------------- chat
async function vChat() {
  const rooms = [{id: "team", name: "Team room", role: "Everyone (@all, @name, /commands)"}, ...S.members.map(m => ({id: m.id, name: m.name, role: m.role}))];
  const list = h("div", {class: "card rooms"}, rooms.map(r => h("div", {class: "room" + (r.id === ROOM ? " on" : ""), onclick: () => { ROOM = r.id; render(); }},
    h("div", {}, h("div", {}, h("b", {}, r.name)), h("div", {class: "r"}, r.role)))));
  const msgs = h("div", {class: "msgs"}), think = h("div", {class: "small muted", style: "min-height:18px"});
  const box = h("textarea", {placeholder: ROOM === "team" ? "Message everyone — @all give status · @name … · /help" : `Message ${nameOf(ROOM)} — instructions, corrections, T-012 feedback, /help`});
  const send = h("button", {class: "primary"}, "Send");
  const doSend = async () => { const t = box.value.trim(); if (!t) return; box.value = ""; try { await api("/api/chat", {room: ROOM, text: t}); poll(); } catch (e) { toast(e.message); } };
  send.onclick = doSend; box.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); doSend(); } });
  let after = -1;
  async function poll() {
    try {
      const r = await api(`/api/chat?room=${encodeURIComponent(ROOM)}&after=${after}`);
      const stick = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 60;
      for (const m of r.messages) {
        after = Math.max(after, m.i);
        const mine = m.who === S.owner_key;
