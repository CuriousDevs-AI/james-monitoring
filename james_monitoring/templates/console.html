<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console · james-monitoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<style>
/* Design system: same tokens as Janus — light, technical, warm neutrals, blue accent, square corners */
:root{
  --background:#ffffff;--surface:#ffffff;--surface-2:#f7f5f1;--surface-3:#efebe3;--foreground:#0a1424;--muted:#647085;
  --border:#e8e1d8;--border-strong:#d7cdbe;--accent:#2563eb;--accent-fg:#ffffff;--accent-muted:rgba(37,99,235,.08);
  --accent-border:rgba(37,99,235,.35);--success:#15803d;--success-muted:rgba(22,163,74,.1);--warning:#b45309;
  --warning-muted:rgba(217,119,6,.1);--danger:#dc2626;--danger-muted:rgba(220,38,38,.1);--info:#7c3aed;--info-muted:rgba(124,58,237,.1);
  --ring:#1d4ed8;--font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;border-color:var(--border)}
html{color-scheme:light}
body{margin:0;background:var(--background);color:var(--foreground);font:13px/1.5 var(--font);-webkit-font-smoothing:antialiased;font-feature-settings:"cv02","cv03","cv04","cv11"}
::selection{background:var(--accent-muted)}
*{scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.bg-grid{background-image:linear-gradient(rgba(10,20,36,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(10,20,36,.045) 1px,transparent 1px);background-size:34px 34px}
svg.i{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.lg{width:18px;height:18px}
@keyframes fade{from{opacity:0}to{opacity:1}} @keyframes slide{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes sheet{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}} @keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}

/* shell */
.shell{display:flex;min-height:100vh}
aside{width:248px;flex:none;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.brand{height:56px;display:flex;align-items:center;gap:9px;padding:0 16px;border-bottom:1px solid var(--border)}
.logo{width:24px;height:24px;background:var(--foreground);color:var(--background);display:grid;place-items:center;font-weight:700;font-size:12px}
.brand b{font-size:13px;display:block;line-height:1.1} .brand small{font-size:10px;color:var(--muted)}
.navsec{padding:12px 12px 0} .navsec p{margin:0 0 4px;padding:0 8px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.navitem{display:flex;align-items:center;gap:10px;padding:6px 8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.navitem:hover{background:var(--surface-2);color:var(--foreground)} .navitem.on{background:var(--accent-muted);color:var(--foreground)} .navitem.on svg{color:var(--accent)}
.navitem .count{margin-left:auto}
.side-foot{margin-top:auto;border-top:1px solid var(--border);padding:12px;display:flex;align-items:center;gap:8px}
.side-foot .who{font-size:12px;font-weight:500;line-height:1.1} .side-foot .sub{font-size:10px;color:var(--muted)}
.content{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 20px;position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);z-index:10}
.crumb{display:flex;gap:6px;align-items:center;font-size:13px;min-width:0} .crumb span{color:var(--muted)} .crumb b{font-weight:500}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface-2);padding:6px 10px;color:var(--muted);font-size:12px;cursor:pointer;min-width:220px}
.search:hover{border-color:var(--border-strong);color:var(--foreground)} .kbd{margin-left:auto;border:1px solid var(--border);padding:0 4px;font-size:10px;font-family:var(--mono)}
.btn.menu-btn{display:none}
main{padding:20px 24px 60px;animation:fade .15s ease-out}
.navscroll{flex:1;overflow:auto;padding-bottom:12px} .navadd{cursor:pointer;display:inline-grid;place-items:center;width:18px;height:18px;color:var(--muted)} .navadd:hover{background:var(--surface-3);color:var(--foreground)}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pmark{display:inline-grid;place-items:center;width:28px;height:28px;flex:none;color:#fff;font-weight:600;font-size:11px;line-height:1} .pmark.xs{width:16px;height:16px;font-size:8px} .pmark.sm2{width:28px;height:28px}
.pmark.lg{width:44px;height:44px;font-size:15px}
.pile{display:inline-flex;align-items:center;padding-left:6px} .pile .av{margin-left:-4px;box-shadow:0 0 0 2px var(--surface)} .pile .more{background:var(--surface-3);color:var(--muted)}
.progress{flex:1;height:6px;background:var(--surface-3);min-width:60px} .progress>div{height:6px;transition:width .3s}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard{cursor:pointer;transition:border-color .12s,box-shadow .12s;display:flex;flex-direction:column} .pcard:hover{border-color:var(--border-strong);box-shadow:0 6px 20px -12px rgba(10,20,36,.25)} .pcard .card-b{flex:1}
.card-f{display:flex;align-items:center;gap:4px;padding:6px 8px;border-top:1px solid var(--border);background:var(--surface-2)}
.phead{margin:-4px 0 18px} .phead h1{font-size:22px;margin:0;letter-spacing:-.01em}
.pmeta{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-end;margin:16px 0 0;padding:12px 16px;border:1px solid var(--border);background:var(--surface)}
.pmeta>div{display:flex;flex-direction:column;gap:6px;font-size:13px} .pmeta .l{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-top:16px;overflow-x:auto}
.tab{display:flex;align-items:center;gap:7px;padding:9px 14px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--foreground)} .tab.on{color:var(--foreground);border-bottom-color:var(--accent);font-weight:500} .tab.on svg{color:var(--accent)} .tab .n{font-size:10.5px;background:var(--surface-3);padding:0 5px;color:var(--muted)}
.pchat .conv{border:1px solid var(--border);height:calc(100vh - 330px);min-height:420px}
.rooms-h{padding:12px 12px 6px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);background:var(--surface-2)}
.chipsel{display:flex;flex-wrap:wrap;gap:6px} .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border:1px solid var(--border);cursor:pointer;font-size:12.5px;background:var(--surface);user-select:none}
.bulkbar{margin-top:12px;border-color:var(--accent);background:var(--accent-muted)} .bulkbar .card-b{gap:16px;align-items:center}
.chip:hover{border-color:var(--border-strong)} .chip.on{border-color:var(--accent);background:var(--accent-muted)} .chip.on::after{content:"✓";color:var(--accent);font-size:11px}
@media(max-width:860px){aside{position:fixed;left:-260px;z-index:40;transition:left .15s} aside.open{left:0;box-shadow:0 0 30px rgba(10,20,36,.12)} .pmeta{gap:16px}
  .btn.menu-btn{display:inline-flex} .search{min-width:0} .search .label,.search .kbd{display:none} main{padding:16px}
  .topbar{padding:0 12px;gap:6px} .hide-sm,.crumb .co{display:none!important} .topbar .btn .lbl{display:none}
  body.nav-open::after{content:"";position:fixed;inset:0;background:rgba(10,20,36,.25);z-index:35}}

/* page header */
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.ph h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em} .ph p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.ph .actions{display:flex;gap:8px;flex-wrap:wrap}
h2.sec{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:6px}

/* primitives */
.card{border:1px solid var(--border);background:var(--surface)} .card-h{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.card-h h3{margin:0;font-size:13px;font-weight:600} .card-b{padding:12px 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;font:500 13px var(--font);border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s;color:var(--foreground);background:transparent}
.btn:focus-visible,input:focus,select:focus,textarea:focus{outline:none;box-shadow:0 0 0 2px var(--ring)}
[tabindex]:focus-visible,.navitem:focus-visible,.room:focus-visible,.tab:focus-visible,.li.click:focus-visible,.tcard:focus-visible,.pcard:focus-visible,.chip:focus-visible,.badge.click:focus-visible{outline:2px solid var(--ring);outline-offset:-2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.btn.primary{background:var(--accent);color:var(--accent-fg)} .btn.primary:hover{background:#1d4fd8}
.btn.secondary{background:var(--surface-3);border-color:var(--border)} .btn.secondary:hover{border-color:var(--border-strong)}
.btn.outline{border-color:var(--border)} .btn.outline:hover{background:var(--surface-2)}
.btn.ghost:hover{background:var(--surface-2)} .btn.danger{background:var(--danger-muted);color:var(--danger);border-color:rgba(220,38,38,.3)}
.btn.success{background:var(--success-muted);color:var(--success);border-color:rgba(22,163,74,.3)}
.btn.sm{height:28px;padding:0 10px;font-size:12px} .btn.icon{width:32px;padding:0} .btn:disabled{opacity:.4;pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);background:var(--surface-3);color:var(--muted);padding:2px 6px;font-size:11px;font-weight:500;line-height:1.2;white-space:nowrap}
.badge.accent{background:var(--accent-muted);color:var(--accent);border-color:var(--accent-border)}
.badge.success{background:var(--success-muted);color:var(--success);border-color:rgba(22,163,74,.3)}
.badge.warning{background:var(--warning-muted);color:var(--warning);border-color:rgba(217,119,6,.3)}
.badge.danger{background:var(--danger-muted);color:var(--danger);border-color:rgba(220,38,38,.3)}
.badge.info{background:var(--info-muted);color:var(--info);border-color:rgba(124,58,237,.3)}
.badge.outline{background:transparent;color:var(--foreground)}
.av{display:inline-grid;place-items:center;width:28px;height:28px;flex:none;color:#fff;font-size:11px;font-weight:600;border-radius:50%}
.av.sm{width:22px;height:22px;font-size:9.5px} .av.lg{width:40px;height:40px;font-size:14px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap} .grow{flex:1} .muted{color:var(--muted)} .small{font-size:12px} .xs{font-size:11px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.metrics{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:18px}
.metric{border:1px solid var(--border);background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.metric .l{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)} .metric .v{font:600 22px/1 var(--mono)}
.cols{display:grid;gap:16px;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)} @media(max-width:1000px){.cols{grid-template-columns:1fr}}
.list>*+*{border-top:1px solid var(--border)}
.li{display:flex;gap:10px;align-items:flex-start;padding:10px 14px} .li.click{cursor:pointer} .li.click:hover{background:var(--surface-2)}
.li .t{font-weight:500} .ico{width:28px;height:28px;display:grid;place-items:center;flex:none;border:1px solid var(--border);background:var(--surface-2)}
.ico.danger{color:var(--danger);background:var(--danger-muted);border-color:rgba(220,38,38,.25)} .ico.warning{color:var(--warning);background:var(--warning-muted);border-color:rgba(217,119,6,.25)}
.ico.accent{color:var(--accent);background:var(--accent-muted);border-color:var(--accent-border)} .ico.success{color:var(--success);background:var(--success-muted);border-color:rgba(22,163,74,.25)}
.empty{border:1px dashed var(--border);display:flex;flex-direction:column;align-items:center;gap:8px;padding:34px 16px;text-align:center}
.empty .ico{width:40px;height:40px;border-radius:50%} .empty b{font-weight:500} .empty p{margin:0;max-width:360px;font-size:12px;color:var(--muted)}
label.f{display:block;font-size:11px;font-weight:500;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;font:13px var(--font);padding:7px 10px;border:1px solid var(--border);background:var(--background);color:var(--foreground)}
textarea{min-height:84px;resize:vertical} input[type=checkbox]{width:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px} .three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:620px){.two,.three{grid-template-columns:1fr}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--border-strong);display:inline-block;flex:none}
.dot.on-track{background:var(--success)}.dot.at-risk{background:var(--warning)}.dot.blocked{background:var(--danger)}.dot.not-started{background:var(--border-strong)}
.err{color:var(--danger);font-size:12px} pre{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--border);padding:10px;font:12px/1.5 var(--mono);margin:0}
.md{font-size:13px} .md h2,.md h3,.md h4{margin:14px 0 6px;font-size:13px} .md h2{font-size:15px} .md p{margin:4px 0} .md ul{margin:4px 0 6px 18px;padding:0} .md code{font-family:var(--mono);background:var(--surface-2);padding:0 4px}
.dots span{animation:blink 1.2s infinite both;display:inline-block} .dots span:nth-child(2){animation-delay:.2s} .dots span:nth-child(3){animation-delay:.4s}

/* chat */
.chat{display:grid;grid-template-columns:268px 1fr;height:calc(100vh - 96px);border:1px solid var(--border)}
@media(max-width:860px){.chat{grid-template-columns:1fr;height:auto} .chat .rooms{max-height:230px;border-right:none;border-bottom:1px solid var(--border)} .conv-h .pile,.conv-h .xs{display:none} .conv-h b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block} .conv-h .btn{padding:4px 8px}}
.rooms{border-right:1px solid var(--border);overflow:auto;background:var(--surface)}
.room{display:flex;gap:10px;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--border)} .room:hover{background:var(--surface-2)} .room.on{background:var(--accent-muted);box-shadow:inset 2px 0 0 var(--accent)}
.room .n{font-weight:500} .room .p{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.conv{display:flex;flex-direction:column;min-height:460px;background:var(--surface-2)}
.conv-h{height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--surface)}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;max-width:78%;animation:slide .18s cubic-bezier(.16,1,.3,1)} .msg.me{align-self:flex-end;flex-direction:row-reverse}
.bubble{border:1px solid var(--border);background:var(--surface);padding:8px 12px;white-space:pre-wrap;word-wrap:break-word}
.msg.me .bubble{background:var(--accent);border-color:var(--accent);color:#fff}
.msg .meta{font-size:10.5px;color:var(--muted);margin-bottom:3px} .msg.me .meta{text-align:right}
.msg.system{align-self:center;max-width:92%} .msg.system .bubble{background:var(--surface-3);font-family:var(--mono);font-size:12px}
.msg.ask .bubble{border:1px solid rgba(220,38,38,.45);box-shadow:inset 3px 0 0 var(--danger)} .msg.notice .bubble{box-shadow:inset 3px 0 0 var(--warning)}
.msg.internal .bubble{background:var(--surface-2);border-style:dashed;color:var(--muted);font-size:12.5px} .via{font-size:9.5px;padding:0 4px;border:1px solid var(--border);margin-left:4px;text-transform:uppercase;letter-spacing:.04em}
.perm{display:grid;grid-template-columns:1fr 120px;gap:6px 10px;align-items:center} .perm select{padding:4px 6px}
.readonly{padding:12px;font-size:12px;color:var(--muted);text-align:center}
.content,main,.cols>div{min-width:0} body{overflow-x:hidden}
.li{flex-wrap:wrap} .li>.grow{min-width:min(200px,60%)} .li>.row:last-child{flex-shrink:0;margin-left:auto} .card-h{flex-wrap:wrap}
.unread{margin-left:auto;background:var(--accent);color:#fff;font:600 10px/1 var(--mono);padding:3px 6px;border-radius:9px}
.day{align-self:center;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:6px 0}
.bubble .md p{margin:0 0 4px} .bubble .md p:last-child{margin:0} .bubble pre{margin:6px 0;background:rgba(10,20,36,.05)} .msg.me .bubble a{color:#fff;text-decoration:underline}
.thinking{align-self:flex-start;font-size:12px;color:var(--muted);padding:4px 2px}
.outcome{margin-top:8px;font-size:12px;font-weight:500}
.spin{width:14px;height:14px;border:2px solid var(--border-strong);border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.movesel{display:none;margin-top:6px;padding:3px 6px;font-size:12px} @media (pointer:coarse){.movesel{display:block}}
.req::after{content:" *";color:var(--danger)} .dirty{color:var(--warning);font-size:12px}
@media(max-width:620px){.li{flex-wrap:wrap} .li>.row:last-child{width:100%;justify-content:flex-end} .metrics{grid-template-columns:repeat(3,1fr)} .metric{padding:8px 10px} .metric .v{font-size:18px} .tabs{flex-wrap:nowrap} .ph .actions{width:100%}}
.composer{border-top:1px solid var(--border);background:var(--surface);padding:10px 12px}
.composer .box{display:flex;gap:8px;align-items:flex-end} .composer textarea{min-height:40px;height:40px;resize:none}
.chips{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap} .chips .badge{cursor:pointer} .badge.click{cursor:pointer} .badge.click:hover{border-color:var(--accent);color:var(--accent)} .chips .badge:hover{border-color:var(--accent-border);color:var(--accent)}

/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border:1px solid var(--border);min-height:200px;display:flex;flex-direction:column}
.col.over{border-color:var(--accent);background:var(--accent-muted)}
.col-h{padding:9px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.col-b{padding:8px;display:flex;flex-direction:column;gap:8px;flex:1}
.tcard{background:var(--surface);border:1px solid var(--border);padding:10px;cursor:grab;animation:slide .18s} .tcard:hover{border-color:var(--border-strong)} .tcard.drag{opacity:.4}
.tcard .ttl{font-weight:500;margin:5px 0 8px}

/* sheet, palette, toasts */
.scrim{position:fixed;inset:0;background:rgba(10,20,36,.25);z-index:30;display:none;animation:fade .15s} .scrim.open{display:block}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);border-left:1px solid var(--border);z-index:31;display:none;flex-direction:column}
.sheet.open{display:flex;animation:sheet .18s cubic-bezier(.16,1,.3,1)} .sheet-h{height:56px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--border)}
.sheet-b{padding:16px;overflow:auto;flex:1} .sheet-b h2.sec{margin-top:18px}
.palette{position:fixed;top:12vh;left:50%;transform:translateX(-50%);width:min(620px,94vw);background:var(--surface);border:1px solid var(--border-strong);z-index:50;display:none;box-shadow:0 20px 60px rgba(10,20,36,.2)}
.palette.open{display:block;animation:slide .15s} .palette input{border:none;border-bottom:1px solid var(--border);padding:14px 16px;font-size:14px}
.palette input:focus{box-shadow:none} .pal-list{max-height:380px;overflow:auto;padding:6px 0}
.pal-g{padding:6px 16px 2px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

.toasts{position:fixed;bottom:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--surface);border:1px solid var(--border-strong);padding:10px 14px;min-width:240px;box-shadow:0 8px 24px rgba(10,20,36,.12);animation:slide .18s;display:flex;gap:8px;align-items:center}
.drop{border:1px dashed var(--border-strong);background:var(--surface-2);padding:24px;text-align:center} .drop.over{border-color:var(--accent);background:var(--accent-muted)}
.steps{list-style:none;padding:0;margin:8px 0;display:grid;gap:4px} .steps li{display:flex;gap:6px;align-items:center;font-size:12.5px}
.setup{min-height:100vh;display:flex;justify-content:center;padding:40px 16px}
.setup-in{width:min(720px,100%)} .step-n{width:22px;height:22px;display:grid;place-items:center;background:var(--foreground);color:#fff;font:600 11px var(--mono)}
