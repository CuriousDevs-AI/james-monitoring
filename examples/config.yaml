# james-monitoring — example config. `jm init` writes this for you (and verifies every Telegram link);
# edit it by hand any time. Secrets never go here: they live in .env next to this file.

company: Acme Robotics
timezone: Europe/Madrid          # any IANA timezone

owner:
  name: Maria Lopez
  telegram_user_id: 0            # jm init detects it; or DM any team bot /whoami
  extra_user_ids: []             # other humans allowed to command the team (optional)
  git_name: ""                   # your git identity: every team commit / PR is yours (setup fills it from git config)
  git_email: ""

llm:                             # the company default; anyone can have their own (see team below)
  provider: anthropic            # claude-code (Claude subscription, `claude` CLI) · codex-cli (ChatGPT subscription,
                                 # `codex` CLI) · opencode (any model via OpenCode, e.g. zai/glm-4.6) · anthropic ·
                                 # openai (any OpenAI-compatible API) · openrouter · ollama (local)
  model: ""                      # a current model id from your provider ("" = the provider's default)
  base_url: ""                   # openai-compatible servers only; openrouter and ollama fill it in
  api_key_env: ANTHROPIC_API_KEY # the .env variable holding the key (CLI providers need none)
  max_tokens: 8000               # at least 4000 (smaller values are raised)
  # allow_free: true             # opencode only: allow OpenCode's free models (opencode/…), run isolated

workspace:
  path: ./team-workspace         # git repo holding personas, tasks, memory, docs, reports
  push: false                    # true = git push after every change

telegram:
  group_chat_id: 0               # jm init detects it; or send /groupid in the group
  quiet_hours: ["22:00", "08:00"]
  api_base_url: ""               # blank = api.telegram.org

monitor:
  daily_report: "18:30"
  daily_brief: "08:30"           # the personal assistant's morning brief (only if you have one)
  check_every_minutes: 60
  work_sessions: ["10:00", "15:00"]   # Mon–Sat: everyone with open work moves their top task
  stale_days: 7
  blocked_escalate_days: 2
  ask_default_hours: 24

budget:
  daily_tokens_per_agent: 300000

executor:                        # optional: agents change code on a branch; you approve the merge
  command: []                    # ["claude", "-p", "{prompt}", "--permission-mode", "acceptEdits"]
                                 # ["codex", "exec", "--full-auto", "{prompt}"]
  timeout_minutes: 30

limits:
  max_agent_hops: 4

permissions:                     # what people may do on their own: green = do it · yellow = do it and tell me ·
  post_group: yellow             # red = ask me first (an Approve/Reject card; runs only after I approve)
  run_code: red                  # the default; merging code into main always asks, whatever this says
  # create_task, update_task, write_file, message_agent, post_room: green by default

sync:
  mirror_owner: true             # my messages appear in every channel (console ↔ Telegram ↔ Slack)

github:                          # optional — see docs/GITHUB.md (uses the `gh` CLI, signed in as you)
  owner: ""                      # your login or org
  repo: ""                       # owner/name for task issues
  project: 0                     # GitHub Project number; tasks are mirrored there both ways
  prs: false                     # code tasks open real PRs; approve = merge

slack:                           # optional — see docs/SLACK.md; the console fills this in
  owner_user_ids: []
  channels: {}

departments:                     # optional — group people; @engineering reaches a whole department
  engineering: { name: Engineering, head: riya }

clients:                         # optional — who a project is for (client-safe report, optional portal login)
  globex: { name: Globex, contact: "hank@globex.example" }

projects:
  api:
    name: "Public API"
    repo: ""                     # local path of its git repo, for code tasks
    main_branch: main
    lead: riya
    status: active               # active | paused (nobody works on it) | done
    channel: ""                  # telegram | slack | console — "" = the company default (sync.channel)
    client: globex
    # Project settings: apply only when people work on this project. The most specific wins:
    # this person on this project → the project → the person → the company.
    instructions: "Client work for Globex: British spelling; nothing leaves without Maria."
    permissions: { write_file: red }
    agents:
      riya: { role: "Tech lead for Globex", instructions: "Review every PR within a day." }
  app:  { name: "Mobile app", repo: "", main_branch: main, telegram_chat_id: 0 }   # optional own Telegram group

team:                            # any names, any number of people; exactly one has monitor: true
  - { id: james, name: James, role: "Delivery manager and chief of staff", monitor: true }
  - { id: riya,  name: Riya,  role: "Backend lead", projects: [api], department: engineering,
      llm: { provider: codex-cli } }                        # Riya runs on Codex; everyone else on the default
  - { id: omar,  name: Omar,  role: "Product designer", projects: [app],
      permissions: { write_file: yellow } }                 # per-person overrides
  # - { id: ada, name: Ada, role: "Personal assistant", assistant: true }   # works only for you, privately
# Sign-in links for other people are made in Settings → Sign-in links (only a hash of each key is stored here).
# Bot tokens go in .env as TG_TOKEN_<ID>: TG_TOKEN_JAMES=..., TG_TOKEN_RIYA=..., TG_TOKEN_OMAR=...
