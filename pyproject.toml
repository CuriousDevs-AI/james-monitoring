[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "james-monitoring"
version = "0.1.0"
description = "Run a company of AI employees like a real team: web console, Telegram and Slack in sync, git-backed tasks and memory, approvals, and a manager who reports daily. Any model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CuriousDevs" }]
dependencies = [
  "python-telegram-bot[job-queue]>=21.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
slack = ["slack_sdk>=3.27"]
all = ["anthropic>=0.40", "openai>=1.40", "slack_sdk>=3.27"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "anthropic>=0.40", "openai>=1.40", "slack_sdk>=3.27"]

[project.scripts]
jm = "james_monitoring.cli:main"

[tool.setuptools.packages.find]
include = ["james_monitoring*"]

[tool.setuptools.package-data]
james_monitoring = ["templates/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
