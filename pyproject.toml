[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "james-monitoring"
version = "0.1.0"
description = "Run an AI team like a real team: Telegram HQ group + 1:1 DMs, git-backed tasks, permissions and James as delivery manager. Model-agnostic."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CuriousDevs" }]
dependencies = [
  "python-telegram-bot[job-queue]>=21.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
all = ["anthropic>=0.40", "openai>=1.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "anthropic>=0.40", "openai>=1.40"]

[project.scripts]
jm = "james_monitoring.cli:main"

[tool.setuptools.packages.find]
include = ["james_monitoring*"]

[tool.setuptools.package-data]
james_monitoring = ["templates/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
